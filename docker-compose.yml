services:
  postgres:
    image: postgres:17-alpine
    container_name: carely-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carely_user
      POSTGRES_PASSWORD: carely_password
      POSTGRES_DB: carely_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carely_user -d carely_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.23.1
    container_name: carely-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
